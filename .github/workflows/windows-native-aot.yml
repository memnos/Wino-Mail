name: Windows Native AOT

on:
  push:
    branches: [template-subject-recipients]
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Give the sideload package its own identity
        shell: pwsh
        run: |
          $path = "src/Wino.Mail.WinUI/Package.appxmanifest"
          $text = [IO.File]::ReadAllText($path)
          $text = $text.Replace('Name="58272BurakKSE.WinoMailPreview"', 'Name="Memnos.WinoMailTemplates"')
          $text = $text.Replace('Publisher="CN=51FBDAF3-E212-4149-89A2-A2636B3BC911"', 'Publisher="CN=Memnos Wino Mail"')
          $text = $text.Replace('<DisplayName>Wino Mail</DisplayName>', '<DisplayName>Wino Mail (modelli)</DisplayName>')
          $text = $text.Replace('<PublisherDisplayName>Burak KÖSE</PublisherDisplayName>', '<PublisherDisplayName>Memnos</PublisherDisplayName>')
          [IO.File]::WriteAllText($path, $text)

      - name: Create a sideload certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=Memnos Wino Mail" -KeyUsage DigitalSignature -FriendlyName "Wino Mail sideload" -CertStoreLocation "Cert:\CurrentUser\My" -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $password = ConvertTo-SecureString -String "wino-sideload" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath wino-sideload.pfx -Password $password | Out-Null
          Export-Certificate -Cert $cert -FilePath wino-sideload.cer | Out-Null

      - name: Restore
        run: dotnet restore src/Wino.Mail.WinUI/Wino.Mail.WinUI.csproj -p:Platform=x64 -p:RuntimeIdentifier=win-x64

      - name: Keep pre-existing trim warnings from failing the package
        shell: pwsh
        run: |
          $props = [IO.File]::ReadAllText("Directory.Build.props")
          $addition = @"
            <PropertyGroup>
              <WarningsNotAsErrors>`$(WarningsNotAsErrors);CS8600;CS8601;CS8602;CS8603;CS8604;CS8618;CsWinRT1028;CsWinRT1032;CsWinRT1034;CsWinRT1035</WarningsNotAsErrors>
            </PropertyGroup>
          </Project>
          "@
          if ($props -notmatch '</Project>\s*$') { throw "Directory.Build.props has no closing Project tag." }
          $props = [regex]::Replace($props, '</Project>\s*$', $addition)
          [IO.File]::WriteAllText("Directory.Build.props", $props)

      - name: Build the Release package
        run: dotnet build src/Wino.Mail.WinUI/Wino.Mail.WinUI.csproj -c Release -p:Platform=x64 -p:RuntimeIdentifier=win-x64 -p:GenerateAppxPackageOnBuild=true -p:AppxBundle=Never -p:AppxPackageSigningEnabled=false -p:UapAppxPackageBuildMode=SideloadOnly -p:GenerateTemporaryStoreCertificate=false -p:AppxSymbolPackageEnabled=false

      - name: Sign the package
        shell: pwsh
        run: |
          $msix = Get-ChildItem -Recurse -File -Filter *.msix | Sort-Object Length -Descending | Select-Object -First 1
          if ($null -eq $msix) { throw "The build did not produce an MSIX." }
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object { $_.FullName -match '\\x64\\signtool.exe$' } | Sort-Object FullName -Descending | Select-Object -First 1
          if ($null -eq $signtool) { throw "signtool.exe was not found." }
          & $signtool.FullName sign /fd SHA256 /f wino-sideload.pfx /p wino-sideload $msix.FullName
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item $msix.FullName artifacts/WinoMail-modelli-x64.msix
          Copy-Item wino-sideload.cer artifacts/WinoMail-modelli.cer

      - uses: actions/upload-artifact@v4
        with:
          name: wino-mail-modelli-x64
          path: artifacts/*
          if-no-files-found: error
